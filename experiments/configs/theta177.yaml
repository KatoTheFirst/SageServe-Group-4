# D32 (phụ lục θ nếu–thì): như lt.yaml nhưng θ = data/theta_tps_v2_177.csv (θ Bloom = 177 TPS, các mô hình khác giảm cùng tỉ lệ).
# Override lấy từ .hydra của bài v2.1 $RESULTS_ROOT/v21/theta177/<chiến lược> (T48, 23/11/2026).
name: theta177
end_time: 86400
ram_gb: 1.7   # RSS đỉnh T48 1.36 GB (INDEX.csv 25/11/2026) × 1,25, làm tròn lên 0,1
prefix: [performance_model.db_path=data/perf_model_4models.csv]
common: [trace=random_trace, "trace.filename={trace}", "controller={controller}", "global_arbiter.arima_traces=traces/forecasts/{forecast}", "global_arbiter.theta_file={theta}"]
runs:
  - lt4: {vars: {trace: composed_day_3regions_v2, forecast: composed_day_3regions_v2, controller: us3-4models, theta: data/theta_tps_v2_177.csv}, ref_prefix: theta177/}
