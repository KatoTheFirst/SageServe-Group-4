# Độ nhạy (SENSITIVITY.md) trên bản cắt v2 12–15h, mỗi bài một yếu tố (run_sens.sh sens). Mọi bài qua run_patched.py (biến SAGE_*).
name: sens
end_time: 10800
ram_gb: 1.3
max_parallel: 8
script: experiments/run_patched.py
vars: {trace: composed_day_3regions_12to15_v2, theta: data/theta_tps_v2.csv}
prefix: [performance_model.db_path=data/perf_model_4models.csv]
common: [trace=random_trace, "trace.filename={trace}", controller=us3-4models, "global_arbiter.arima_traces=traces/forecasts/{trace}", "global_arbiter.theta_file={theta}"]
prepare:
  - {cmd: ["{py}", experiments/make_sens_traces.py], creates: traces/sens_burst_out.csv}
  - {cmd: ["{py}", generate_causal_arima_forecasts.py, --trace, traces/sens_flat.csv, --output_dir, traces/forecasts/sens_flat], creates: traces/forecasts/sens_flat}
  - {cmd: ["{py}", generate_causal_arima_forecasts.py, --trace, traces/sens_spike.csv, --output_dir, traces/forecasts/sens_spike], creates: traces/forecasts/sens_spike}
  - {cmd: ["{py}", generate_causal_arima_forecasts.py, --trace, traces/sens_rate50.csv, --output_dir, traces/forecasts/sens_rate50], creates: traces/forecasts/sens_rate50}
  - {cmd: ["{py}", generate_causal_arima_forecasts.py, --trace, traces/sens_rate150.csv, --output_dir, traces/forecasts/sens_rate150], creates: traces/forecasts/sens_rate150}
  - {cmd: ["{py}", -c, "import pandas as pd; t = pd.read_csv('data/theta_tps_v2.csv'); [t.assign(theta_tps=t.theta_tps * f).to_csv('{exp_dir}/theta_' + n + '.csv', index=False) for n, f in (('m30', .7), ('p30', 1.3))]"], creates: "{exp_dir}/theta_p30.csv"}
runs:
  - {name: base/reactive, overrides: [long_term_scaling=False], ref: sens/base/reactive}
  - {name: base/lt_ua, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/base/lt_ua}
  - {name: flat/reactive, vars: {trace: sens_flat}, overrides: [long_term_scaling=False], ref: sens/flat/reactive}
  - {name: flat/lt_ua, vars: {trace: sens_flat}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/flat/lt_ua}
  - {name: spike/reactive, vars: {trace: sens_spike}, overrides: [long_term_scaling=False], ref: sens/spike/reactive}
  - {name: spike/lt_ua, vars: {trace: sens_spike}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/spike/lt_ua}
  - {name: r50/reactive, vars: {trace: sens_rate50}, overrides: [long_term_scaling=False], ref: sens/r50/reactive}
  - {name: r50/lt_ua, vars: {trace: sens_rate50}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/r50/lt_ua}
  - {name: r150/reactive, vars: {trace: sens_rate150}, overrides: [long_term_scaling=False], ref: sens/r150/reactive}
  - {name: r150/lt_ua, vars: {trace: sens_rate150}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/r150/lt_ua}
  - {name: su300/reactive, env: {SAGE_SPIN_UP: 300}, overrides: [long_term_scaling=False], ref: sens/su300/reactive}
  - {name: su300/lt_ua, env: {SAGE_SPIN_UP: 300}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/su300/lt_ua}
  - {name: su1200/reactive, env: {SAGE_SPIN_UP: 1200}, overrides: [long_term_scaling=False], ref: sens/su1200/reactive}
  - {name: su1200/lt_ua, env: {SAGE_SPIN_UP: 1200}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/su1200/lt_ua}
  - {name: wait/reactive, env: {SAGE_WAIT: 1}, overrides: [long_term_scaling=False], ref: sens/wait/reactive}
  - {name: eps70/lt_ua, overrides: [long_term_scaling=True, global_arbiter.epsilon=0.63], arbiter: global_arbiter_ARIMA_checking, ref: sens/eps70/lt_ua}
  - {name: eps100/lt_ua, overrides: [long_term_scaling=True, global_arbiter.epsilon=1.0], arbiter: global_arbiter_ARIMA_checking, ref: sens/eps100/lt_ua}
  - {name: b7/lt_ua, env: {SAGE_BETA: 0.07}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/b7/lt_ua}
  - {name: b13/lt_ua, env: {SAGE_BETA: 0.13}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/b13/lt_ua}
  - {name: thm30/lt_ua, vars: {theta: '{exp_dir}/theta_m30.csv'}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/thm30/lt_ua}
  - {name: thp30/lt_ua, vars: {theta: '{exp_dir}/theta_p30.csv'}, overrides: [long_term_scaling=True], arbiter: global_arbiter_ARIMA_checking, ref: sens/thp30/lt_ua}
