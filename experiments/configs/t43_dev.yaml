# Trace và dự báo không có trong repo: sinh theo docs/E2E_DEV_V1.md (preprocess_traces.py, generate_causal_arima_forecasts.py).
name: t43_dev
end_time: 90000
ram_gb: 1.0
prefix: [performance_model.db_path=data/perf_model_4models.csv]
common: [trace=random_trace, trace.filename=azure_trace_dev_1day]
runs:
