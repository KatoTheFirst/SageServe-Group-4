# §7.2.6, Fig. 15: FCFS / EDF / PF / DPA, giờ 12–15h, năng lực cố định; SLA IW-N 60 s và 6 s (run.sh sched; end_time 86400 như run.sh)
name: sched
end_time: 86400
ram_gb: 0.7   # RSS đỉnh T48 0.53 GB (INDEX.csv 25/11/2026) × 1,25, làm tròn lên 0,1
prefix: [performance_model.db_path=data/perf_model_4models.csv]
common: [trace=random_trace, "trace.filename={trace}", controller=us3-4models-fixed75, short_term_scaling=False]
runs:
