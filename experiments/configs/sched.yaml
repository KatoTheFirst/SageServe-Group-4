  - {name: sla60/edf, vars: {trace: composed_day_3regions_12to15_v2}, overrides: [queue_policy=edf], ref: sched/sla60/edf}
  - {name: sla60/pf, vars: {trace: composed_day_3regions_12to15_v2}, overrides: [queue_policy=pf], ref: sched/sla60/pf}
  - {name: sla60/dpa, vars: {trace: composed_day_3regions_12to15_v2}, overrides: [queue_policy=dpa], ref: sched/sla60/dpa}
  - {name: sla6/fcfs, vars: {trace: composed_day_3regions_12to15_iwn6_v2}, overrides: [queue_policy=fcfs], ref: sched/sla6/fcfs}
  - {name: sla6/edf, vars: {trace: composed_day_3regions_12to15_iwn6_v2}, overrides: [queue_policy=edf], ref: sched/sla6/edf}
  - {name: sla6/pf, vars: {trace: composed_day_3regions_12to15_iwn6_v2}, overrides: [queue_policy=pf], ref: sched/sla6/pf}
  - {name: sla6/dpa, vars: {trace: composed_day_3regions_12to15_iwn6_v2}, overrides: [queue_policy=dpa], ref: sched/sla6/dpa}
